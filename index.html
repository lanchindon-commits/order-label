<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>訂貨標籤產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：上方貼訊息 → 中間可修正欄位 → 下方標籤預覽與列印按鈕；手機單欄，桌機兩欄 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b1f1d; --muted:#626a66; --line:#d9ddd9;
  --accent:#0f7a4a; --accent-ink:#ffffff; --warn:#b45309;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141816; --panel:#1d2220; --ink:#e8ebe9; --muted:#9aa39e; --line:#333a37;
    --accent:#2fb173; --accent-ink:#06150d; --warn:#f59e0b; color-scheme:dark }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header h1{font-size:22px;margin:0 0 4px;font-weight:900}
header p{margin:0 0 18px;color:var(--muted);font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:820px){.grid{grid-template-columns:1fr 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:170px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fields .full{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.check input{width:auto}
.preview{display:flex;justify-content:center;padding:18px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:8px}
#labelImg{max-width:100%;width:320px;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:6px;background:#fff}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.msg{font-size:13px;color:var(--warn);min-height:1.2em;margin-top:8px}
.ok{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>訂貨標籤產生器</h1>
    <p>把傳給客人的 LINE 預訂訊息貼上來，自動帶出標籤，按「列印標籤」直接用 P1 印出。</p>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>1．貼上 LINE 訊息</h2>
      <textarea id="src" autofocus placeholder="把 LINE 訂貨訊息貼在這裡，標籤會自動產生

例如：
您好，我是技師(中寶)
您的愛車:868-KCB
材料 (副廠排氣管)
價錢 ($1800)"></textarea>
      <div class="row">
        <button class="primary" id="btnParse">解析訊息</button>
        <button id="btnPaste">從剪貼簿貼上</button>
      </div>
      <div class="msg" id="parseMsg"></div>

      <h2 style="margin-top:16px">2．確認內容（可直接修改）</h2>
      <div class="fields">
        <label>預定日期<input id="fDate"></label>
        <label>定料技師<input id="fTech"></label>
        <label>車牌<input id="fPlate"></label>
        <label>價錢<input id="fPrice" inputmode="numeric"></label>
        <label class="full">材料名稱<input id="fPart"></label>
        <label>客人名稱<input id="fName"></label>
        <label>標籤尺寸
          <select id="fSize">
            <option value="30x40">30 × 40 mm（直式）</option>
            <option value="40x30">40 × 30 mm</option>
            <option value="50x30">50 × 30 mm</option>
            <option value="50x40">50 × 40 mm</option>
            <option value="50x50">50 × 50 mm</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="fShowName">標籤上印客人名稱</label>
        <label class="check">列印方向
          <select id="fRotate" style="width:auto">
            <option value="0">不旋轉</option>
            <option value="90">旋轉 90°</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button id="btnMsg">反過來：用上面欄位產生 LINE 訊息並複製</button>
      </div>
      <div class="msg" id="copyMsg"></div>
    </section>

    <section class="panel">
      <h2>3．標籤預覽</h2>
      <div class="preview"><img id="labelImg" alt="訂貨標籤預覽"></div>
      <div class="row">
        <button class="primary" id="btnPc">列印標籤</button>
        <button id="btnDownload">下載圖片</button>
        <button id="btnCopyImg">複製圖片</button>
      </div>
      <div class="msg" id="outMsg"></div>
      <p class="hint">P1 用 USB 接在這台電腦（需已安裝德佟打印助手／P1 驅動），按「列印標籤」會自動找 P1 列印。<br>
      快速鍵：貼上訊息後按 <b>Ctrl + Enter</b> 直接列印。</p>
    </section>
  </div>
</div>

<canvas id="cv" hidden></canvas>
<canvas id="pcv" hidden></canvas>
<!-- 德佟 LPAPI：瀏覽器藍牙(BLE)/USB 直接列印 -->

<!-- 德佟 dtpweb：電腦端打印助手（127.0.0.1） -->

<script>
const $ = id => document.getElementById(id);
const DPMM = 16;            // 每 mm 像素（203dpi 的 2 倍，縮放後依然清晰）
let lastBlob = null;

function today(){ const d=new Date(); return (d.getMonth()+1)+"/"+d.getDate(); }

// ── 解析 LINE 訊息 ──
function parseMsg(t){
  const s = t.replace(/\r/g,"").replace(/（/g,"(").replace(/）/g,")").replace(/：/g,":");
  const lines = s.split("\n").map(x=>x.trim()).filter(Boolean);
  const pick = re => { const m = s.match(re); return m ? m[1].trim() : ""; };
  const r = {
    tech:  pick(/技師\s*\(?\s*([^)\n]+?)\s*\)/) || pick(/技師\s*[:\s]\s*(\S+)/),
    plate: pick(/愛車\s*:?\s*([A-Za-z0-9]+-[A-Za-z0-9]+)/) || pick(/\b([A-Z0-9]{2,4}-[A-Z0-9]{2,4})\b/i),
    part:  pick(/材料\s*\(\s*([^)\n]+)\)/) || pick(/材料(?:名稱)?\s*:?\s*([^\n]+)/),
    price: pick(/價[錢格]\s*\(?\s*\$?\s*([\d,]+)/).replace(/,/g,""),
    name:  ""
  };
  // 第一行如果不是問候/欄位，就當客人名稱
  if (lines.length && !/您好|技師|愛車|材料|價|預訂/.test(lines[0])) r.name = lines[0];
  r.plate = r.plate.toUpperCase();
  return r;
}

function fillFromMsg(){
  if (!$("src").value.trim()){ $("parseMsg").textContent=""; return; }
  const r = parseMsg($("src").value);
  $("fTech").value = r.tech; $("fPlate").value = r.plate; $("fPart").value = r.part;
  $("fPrice").value = r.price; $("fName").value = r.name;
  if (!$("fDate").value) $("fDate").value = today();
  const miss = [["技師",r.tech],["車牌",r.plate],["材料",r.part],["價錢",r.price]].filter(x=>!x[1]).map(x=>x[0]);
  const el = $("parseMsg");
  el.className = "msg" + (miss.length ? "" : " ok");
  el.textContent = miss.length ? "找不到：" + miss.join("、") + "，請在下方手動補上。" : "已帶入，請確認內容。";
  draw();
}

// ── 畫標籤 ──
function wrapText(ctx, text, maxW){
  const out=[]; let cur="";
  const noStart = "、，。,.)）：:；;！!？?」』%";
  for (const ch of text){
    if (ctx.measureText(cur+ch).width > maxW && cur && !noStart.includes(ch)){ out.push(cur); cur = ch===" " ? "" : ch; }
    else cur+=ch;
  }
  if (cur) out.push(cur); return out.length?out:[""];
}

function layout(ctx, W, H, fs, rows, pfs){
  const pad = Math.round(W*0.05), maxW = W - pad*2;
  const ops=[]; let y = pad, broke=false;
  for (const r of rows){
    const base = r.part ? (pfs||fs) : fs;
    let size = base * (r.scale||1);
    const F = z => `900 ${z}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
    ctx.font = F(size);
    // 單行欄位放不下時，只縮這一行，不拖累整張標籤
    if (r.nowrap){
      const txt = (r.label||"") + (r.value||"");
      const minSize = (r.scale||1) > 1 ? base : base*0.75;  // 車牌最小跟其他行一樣大；一般欄位太長可單獨縮到 75%
      while (ctx.measureText(txt).width > maxW && size > minSize){ size -= 1; ctx.font = F(size); }
      if (ctx.measureText(txt).width > maxW) broke = true;
    }
    const lh = Math.max(size, base)*1.22;
    if (r.label && r.inline){
      const lw = ctx.measureText(r.label).width;
      const vlines = wrapText(ctx, r.value, maxW - lw);
      if (r.nowrap && vlines.length>1) broke=true;
      vlines.forEach((v,i)=>{ ops.push({font:ctx.font,x:pad,y,t:i?"":r.label}); ops.push({font:ctx.font,x:pad+lw,y,t:v}); y+=lh; });
    } else {
      const lines = wrapText(ctx, (r.label||"") + (r.value||""), maxW);
      if (r.nowrap && lines.length>1) broke=true;
      lines.forEach(v=>{ ops.push({font:ctx.font,x:pad,y,t:v}); y+=lh; });
    }
  }
  return {ops, h:y+pad, broke};
}

function draw(){
  const [mw,mh] = $("fSize").value.split("x").map(Number);
  const W = mw*DPMM, H = mh*DPMM;
  const cv = $("cv"); cv.width=W; cv.height=H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#000"; ctx.textBaseline="top";

  const price = $("fPrice").value.trim();
  const rows = [];
  if ($("fShowName").checked && $("fName").value.trim()) rows.push({label:"客人：",value:$("fName").value.trim(),inline:true});
  rows.push({label:"預定日期：",value:$("fDate").value.trim(),inline:true,nowrap:true});
  rows.push({label:"定料技師：",value:$("fTech").value.trim(),inline:true,nowrap:true});
  if (mw < mh){  // 直式標籤：車牌、材料另起一行，跟原本手寫標籤一樣
    rows.push({label:"車牌：",value:$("fPlate").value.trim(),inline:true,bold:true,scale:1.2,nowrap:true});
    rows.push({label:"材料名稱："});
    rows.push({value:$("fPart").value.trim(),part:true});
  } else {
    rows.push({label:"車牌：",value:$("fPlate").value.trim(),inline:true,bold:true,scale:1.25,nowrap:true});
    rows.push({label:"材料名稱：",value:$("fPart").value.trim(),inline:true,part:true});
  }
  rows.push({label:"價錢：",value:price ? "$"+price : "",inline:true,nowrap:true});

  // 從大字開始縮，直到塞得進標籤
  // 1) 整體字級從大往下縮，但欄位字不低於 FLOOR（約 2.8mm，熱感紙還看得清楚）
  // 2) 還放不下 → 只縮「材料名稱」內容
  // 3) 真的太長 → 全部一起再縮
  const bad = r => r.h > H || r.broke;
  const FLOOR = Math.round(H/11), PMIN = Math.round(H/24);
  // 用二分法找「最大可用字級」，每次只排版約 8 次，比一格一格縮快很多
  const maxOk = (lo, hi, ok) => { let best = -1; while (lo <= hi){ const m = (lo+hi)>>1; if (ok(m)){ best = m; lo = m+1; } else hi = m-1; } return best; };
  const TOP = Math.round(H/4);
  let fs = maxOk(12, TOP, f => !bad(layout(ctx,W,H,f,rows,f)));
  let pfs = fs, res;
  if (fs < FLOOR){
    // 高度不夠：欄位字維持在 FLOOR（若寬度允許），只縮材料
    const fsW = maxOk(12, TOP, f => !layout(ctx,W,H,f,rows,f).broke);
    fs = Math.max(12, Math.min(FLOOR, fsW));
    pfs = maxOk(PMIN, fs, q => !bad(layout(ctx,W,H,fs,rows,q)));
    if (pfs < 0){  // 材料縮到最小還放不下 → 全部一起縮
      fs = maxOk(12, fs, f => !bad(layout(ctx,W,H,f,rows,Math.min(PMIN,f))));
      if (fs < 0) fs = 12;
      pfs = Math.min(PMIN, fs);
    }
  }
  if (fs < 0){ fs = 12; pfs = 12; }
  res = layout(ctx,W,H,fs,rows,pfs);
  // 多出來的高度平均分配到行距，標籤不會下面空一大塊
  const ys = [...new Set(res.ops.map(o=>o.y))].sort((a,b)=>a-b);
  const gap = ys.length>1 ? Math.min(Math.max(0, H - res.h) / (ys.length-1), fs*0.6) : 0;
  for (const o of res.ops){ ctx.font=o.font; ctx.fillText(o.t, o.x, o.y + ys.indexOf(o.y)*gap); }

  // 預覽：給人看的正向圖
  const img=$("labelImg"); img.src = cv.toDataURL("image/png"); img.style.width = (mw*6.4)+"px";
  // 列印：轉 203dpi(8點/mm)、純黑白、依設定旋轉 90°
  const pc = makePrintCanvas(cv, mw, mh);
  pc.toBlob(b=>{ lastBlob=b; }, "image/png");
}

const PRINT_DPMM = 8;
function rotateOn(){ return $("fRotate").value === "90"; }
function makePrintCanvas(src, mw, mh){
  const w = mw*PRINT_DPMM, h = mh*PRINT_DPMM, rot = rotateOn();
  const pc = $("pcv"); pc.width = rot ? h : w; pc.height = rot ? w : h;
  const c = pc.getContext("2d");
  c.fillStyle="#fff"; c.fillRect(0,0,pc.width,pc.height);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
  if (rot){ c.translate(h,0); c.rotate(Math.PI/2); }
  c.drawImage(src, 0, 0, w, h);
  c.setTransform(1,0,0,1,0,0);
  // 灰階轉純黑白，避免熱感紙印出來淡淡糊糊
  const d = c.getImageData(0,0,pc.width,pc.height), a = d.data;
  for (let i=0;i<a.length;i+=4){ const v = (a[i]*0.3+a[i+1]*0.59+a[i+2]*0.11) < 170 ? 0 : 255; a[i]=a[i+1]=a[i+2]=v; a[i+3]=255; }
  c.putImageData(d,0,0);
  return pc;
}
function printSize(){ const [mw,mh] = $("fSize").value.split("x").map(Number); return rotateOn() ? [mh,mw] : [mw,mh]; }
function printImageEl(){ return new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.src=$("pcv").toDataURL("image/png"); }); }

function fileName(){ return "訂貨_" + ($("fPlate").value||"label").replace(/[^\w-]/g,"") + ".png"; }
function out(t,ok){ const e=$("outMsg"); e.className="msg"+(ok?" ok":""); e.textContent=t; }

// ── 直接列印（德佟 LPAPI：藍牙 BLE / USB） ──
let lp = null;
function env(){ return (navigator.userAgent.match(/Line\//)?"LINE內建瀏覽器 ":"") + (navigator.bluetooth?"支援藍牙 ":"不支援藍牙 ") + (navigator.hid?"支援USB":"不支援USB"); }
async function directPrint(mode, btn){
  await loadLib("ble");
  if (!window.LPAPI || !LPAPI.LPAPI){ out("列印元件載入失敗，請確認網路後重新整理。"); return; }
  if (/Line\//.test(navigator.userAgent)){ out("請不要在 LINE 裡開，請用 Chrome 打開這個網址。"); return; }
  if (mode==="ble" && !navigator.bluetooth){ out("這個瀏覽器不能用網頁藍牙（"+env()+"）。Android 請用 Chrome；iPhone 請改用「分享到標籤 App」。"); return; }
  if (mode==="usb" && !navigator.hid){ out("這個瀏覽器不能用 USB 列印（"+env()+"），請用電腦版 Chrome 或 Edge。"); return; }
  btn.disabled=true;
  try{
    lp = lp || LPAPI.LPAPI.getInstance();
    if (!lp.isPrinterOpened()){
      out(mode==="ble" ? "請在跳出的視窗選擇 P1（名稱可能是 P1、DT 或 DP 開頭）…" : "請在跳出的視窗選擇 USB 印表機…", true);
      const opt = mode==="ble" ? {webBLE:true, bleFilters:"*"} : {webHID:true};
      const req = await lp.requestDevice(opt);
      const dev = req && req.resultInfo && req.resultInfo[0];
      if (!dev){ out("沒有選到印表機（"+(req&&(req.errMsg||req.codeName||req.statusCode))+"｜"+env()+"）。"); return; }
      const op = await lp.openPrinter(Object.assign({deviceId:dev.deviceId, name:dev.name, tryTimes:3}, opt));
      if (op.statusCode!==0){ out("連線 "+dev.name+" 失敗（"+(op.errMsg||op.codeName||op.statusCode)+"），請把 P1 重新開機再試。"); return; }
      out("已連線 "+dev.name+"，列印中…",true);
    } else out("列印中…",true);
    const [pw,ph] = printSize();
    const res = await lp.printImage({image: await printImageEl(), width:pw, height:ph});
    const code = res ? (res.statusCode ?? 0) : 0;
    out(code===0 ? "已送出列印 ✓" : "列印失敗（"+(res.errMsg||res.codeName||code)+"），請檢查紙張或蓋子。", code===0);
  }catch(e){ out("列印出錯："+(e.message||e)+"（"+env()+"）"); }
  finally{ btn.disabled=false; }
}
// ── 電腦列印（dtpweb 打印助手） ──
let pcApi = null, pcPrinter = null;
function pcCheck(){ return new Promise(res=>{
  if (pcApi) return res(pcApi);
  try{ dtpweb.checkServer((resp, api)=>{ if (resp && resp.statusCode===0){ pcApi=api; res(api);} else res(null); }); }
  catch(e){ res(null); }
});}
$("btnPc").onclick = async e=>{
  const btn=e.currentTarget;
  btn.disabled=true; out(pcPrinter ? "列印中…" : "正在連線電腦上的打印助手…",true);
  await loadLib("pc");
  if (!window.dtpweb){ btn.disabled=false; out("電腦列印元件載入失敗，請確認網路後重新整理。"); return; }
  await nextPaint();   // 先讓畫面顯示「列印中」，再做會卡住畫面的同步呼叫
  try{
    const api = await pcCheck();
    if (!api){ out("找不到打印助手。請先在這台電腦安裝「DTPWeb-Inst」或 P1 驅動，裝好後重新整理頁面。"); return; }
    // 先找「已連線的德佟印表機」，找不到再放寬條件（離線、非預設型號、網路印表機）
    const nm = d => d.name || d.deviceName || "";
    if (pcPrinter){
      const [pw,ph] = printSize();
      const ok = api.printImage({ data: $("pcv").toDataURL("image/png"), printerName: pcPrinter, printWidth: pw, printHeight: ph });
      if (ok){ out("已送到 "+pcPrinter+" ✓", true); return; }
      pcPrinter = null;  // 失敗就重新搜尋
    }
    const tries = [
      {onlyLocal:true},
      {onlyLocal:true, onlyOnline:false},
      {onlyLocal:false, onlyOnline:false, onlySupported:false}
    ];
    let list = [], level = 0;
    for (; level < tries.length; level++){ try{ list = api.getPrinters(tries[level]) || []; }catch(e){ list = []; } if (list.length) break; }
    const isDt = d => /P1|DT|DP|德佟|Detong|Dothan/i.test(nm(d));
    const pick = list.find(d=>/P1/i.test(nm(d))) || list.find(isDt);
    if (!pick){
      // 打印助手的清單可能還沒更新（P1 是後來才加進 Windows 的），直接用常見名稱試印一次
      const [pw0,ph0] = printSize();
      for (const guess of ["P1 Label Printer","P1"]){
        let ok0=false; try{ ok0 = api.printImage({ data: $("pcv").toDataURL("image/png"), printerName: guess, printWidth: pw0, printHeight: ph0 }); }catch(e){}
        if (ok0){ pcPrinter = guess; out("已送到 "+guess+" ✓", true); return; }
      }
      const names = list.map(nm).filter(Boolean);
      out(names.length
        ? "沒找到 P1。這台電腦看得到的印表機：" + names.join("、") + "。請確認 P1 用「可傳資料的 USB 線」接上，並在 Windows「印表機與掃描器」裡出現。"
        : "打印助手已啟動，但這台電腦沒有任何印表機。請確認：①P1 開機 ②用可傳資料的 USB 線（不是充電線）③Windows「印表機與掃描器」有出現 P1。");
      return;
    }
    if (level > 0) out("找到 "+nm(pick)+"（狀態可能是離線），嘗試列印…", true);
    pcPrinter = nm(pick);
    const [pw,ph] = printSize();
    const ok = api.printImage({ data: $("pcv").toDataURL("image/png"), printerName: nm(pick), printWidth: pw, printHeight: ph });
    out(ok ? "已送到 "+nm(pick)+" ✓" : "送出失敗，請確認 "+nm(pick)+" 有開機、有紙、蓋子已蓋好；Windows 裡它若顯示「離線」，請把 USB 拔掉重插。", !!ok);
  }catch(err){ out("電腦列印出錯："+(err.message||err)); }
  finally{ btn.disabled=false; }
};

// ── 列印元件：用到才載入 ──
const LIBS = {
  ble: "https://cdn.jsdelivr.net/npm/lpapi-ble@1.7.260618/libs/index.umd.js",
  pc:  "https://cdn.jsdelivr.net/npm/dtpweb@2.7.260512/lib/dtpweb.umd.js"
};
const libLoading = {};
function loadLib(k){
  if (!libLoading[k]) libLoading[k] = new Promise(r=>{ const sc=document.createElement("script"); sc.src=LIBS[k]; sc.onload=()=>r(true); sc.onerror=()=>{ delete libLoading[k]; r(false); }; document.head.appendChild(sc); });
  return libLoading[k];
}
const nextPaint = () => new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

// ── 輸出 ──
$("btnDownload").onclick = ()=>{
  if (!lastBlob) return;
  const a=document.createElement("a"); a.href=URL.createObjectURL(lastBlob); a.download=fileName();
  document.body.appendChild(a); a.click(); a.remove(); out("已下載 "+fileName(),true);
};
$("btnCopyImg").onclick = async ()=>{
  try { await navigator.clipboard.write([new ClipboardItem({"image/png":lastBlob})]); out("圖片已複製。",true); }
  catch(e){ out("這個瀏覽器不能複製圖片，請改用下載或分享。"); }
};
$("btnPaste").onclick = async ()=>{
  try { $("src").value = await navigator.clipboard.readText(); fillFromMsg(); }
  catch(e){ $("parseMsg").className="msg"; $("parseMsg").textContent="無法讀取剪貼簿，請直接在框內長按貼上。"; }
};
$("btnMsg").onclick = async ()=>{
  const name=$("fName").value.trim(), price=$("fPrice").value.trim();
  const t = (name?name+"\n":"") + `您好，我是技師(${$("fTech").value.trim()})\n您的愛車:${$("fPlate").value.trim()}\n材料 (${$("fPart").value.trim()})\n價錢 ($${price})\n已經幫您預訂，貨到通知您，感謝`;
  $("src").value = t;
  try { await navigator.clipboard.writeText(t); $("copyMsg").className="msg ok"; $("copyMsg").textContent="訊息已複製，可直接貼到 LINE。"; }
  catch(e){ $("copyMsg").className="msg"; $("copyMsg").textContent="已放到上方訊息框，請手動複製。"; }
};
$("btnParse").onclick = fillFromMsg;
document.addEventListener("keydown", e=>{ if (e.ctrlKey && e.key==="Enter"){ e.preventDefault(); fillFromMsg(); clearTimeout(drawTimer); draw(); setTimeout(()=>$("btnPc").click(), 50); } });
// 點訊息框就全選，貼上時直接取代舊內容並自動產生標籤
$("src").addEventListener("focus", e=>e.target.select());
$("src").addEventListener("paste", ()=>{ $("fDate").value = today(); setTimeout(fillFromMsg,0); });
let drawTimer = null;
function drawSoon(){ clearTimeout(drawTimer); drawTimer = setTimeout(draw, 150); }
["fDate","fTech","fPlate","fPrice","fPart","fName"].forEach(id=>$(id).addEventListener("input",drawSoon));
["fSize","fShowName","fRotate"].forEach(id=>$(id).addEventListener("change",draw));
try{ const r=localStorage.getItem("labelRotate2"); if(r) $("fRotate").value=r; }catch(e){}
$("fRotate").addEventListener("change",()=>{ try{localStorage.setItem("labelRotate2",$("fRotate").value);}catch(e){} });

// 記住上次選的尺寸
try{ const s=localStorage.getItem("labelSize2"); if(s) $("fSize").value=s; }catch(e){}
$("fSize").addEventListener("change",()=>{ try{localStorage.setItem("labelSize2",$("fSize").value);}catch(e){} });

$("fDate").value = today();
(document.fonts ? document.fonts.load('900 40px "Noto Sans TC"').catch(()=>{}) : Promise.resolve()).then(()=>{ draw(); $("src").focus(); });
</script>
